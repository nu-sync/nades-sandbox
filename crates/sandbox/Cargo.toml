[package]
name = "nades-sandbox"
description = "The native 3D sandbox: a CS2 map, its pro lineups, and the grenades they throw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nades-sandbox"
path = "src/main.rs"

[dependencies]
nades-render.workspace = true
nades-pack.workspace = true
wgpu.workspace = true
winit.workspace = true
egui = { workspace = true, features = ["default_fonts"] }
egui-wgpu.workspace = true
egui-winit.workspace = true
anyhow.workspace = true
glam.workspace = true
serde_json.workspace = true
png.workspace = true
nades-control = { path = "../control" }
nades-model.workspace = true
nades-source-file.workspace = true
nades-config.workspace = true
nades-scene.workspace = true
serde.workspace = true
rayon.workspace = true
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
