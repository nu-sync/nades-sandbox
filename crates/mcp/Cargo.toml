[package]
name = "nades-mcp"
description = "Local MCP tools for observing and operating nades-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
nades-control = { path = "../control" }
nades-pack.workspace = true
nades-model.workspace = true
nades-config.workspace = true
rmcp = { version = "=3.7.0", features = ["server", "transport-io", "macros", "schemars"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs", "signal"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
rmcp = { version = "=3.7.0", features = ["client", "transport-child-process"] }
png.workspace = true
jsonschema = { version = "0.60.1", default-features = false }
