[package]
name = "nades-packer"
description = "nades-pack: a map's pack, built from its Source 2 Viewer export and the game's own files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "nades_packer"
path = "src/lib.rs"

[[bin]]
name = "nades-pack"
path = "src/main.rs"

[dependencies]
nades-pack.workspace = true
nades-source2.workspace = true
nades-config.workspace = true
anyhow.workspace = true
glam.workspace = true
image-webp.workspace = true
memmap2.workspace = true
meshopt.workspace = true
png.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# tests/synthetic.rs writes LZ4 mips as the game does
lz4_flex.workspace = true
# the checks against the export's own decoded files (tests/export.rs): BC blocks and EXR scanlines, never at run time
bcdec_rs = "0.2.1"
exr = "1.74"
