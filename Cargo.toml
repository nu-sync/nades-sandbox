[workspace]
resolver = "3"
members = ["crates/*"]
# the swarm's native spike and the Bevy build of M1 (prototypes/) have their own workspaces
exclude = ["prototypes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# egui 0.37 needs 1.95
rust-version = "1.95"
publish = false

[workspace.dependencies]
nades-control = { path = "crates/control" }
nades-render = { path = "crates/render" }
nades-pack = { path = "crates/pack" }
nades-source2 = { path = "crates/source2" }
nades-model = { path = "crates/model" }
nades-source-file = { path = "crates/source-file" }
nades-source-demo = { path = "crates/source-demo" }
nades-config = { path = "crates/config" }
nades-packer = { path = "crates/packer" }
nades-scene = { path = "crates/scene" }

# GPU and window: one wgpu for the renderer and egui (egui-wgpu 0.37 is built on wgpu 30)
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "dx12"] }
winit = "0.30.13"
egui = "0.37"
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links"] }
pollster = "1"
# Metal: GPU buffers over the pack's own mapped pages (crates/render, map.rs) and the window's first drawable (lib.rs)
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "MTLAllocation", "MTLBuffer", "MTLDevice", "MTLDrawable", "MTLResource", "MTLTexture"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CABase", "CALayer", "CAMetalLayer", "objc2-metal"] }
# the first frame's presented handler (when the window server put it on the display)
block2 = "0.6.2"
objc2 = "0.6.5"

# data and assets
# the cs2-throws files (crates/source-file): SQLite, bundled
rusqlite = { version = "0.41", features = ["bundled"] }
# CS2 demos (crates/source-demo): awpy's parser, and the demo file's SHA-256 that names it
awpy = "3.1"
sha2 = "0.10"
# the platform's config and cache folders (docs/standalone-api.md §8) and the config file
directories = "6"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
memmap2 = "0.9.12"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image-webp = "0.2.4"
lz4_flex = "0.14"
crc32fast = "1.5"
meshopt = "0.7"
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
rayon = "1.12"
anyhow = "1"
png = "0.18"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"

# a debug build that still loads a map in a sensible time
[profile.dev.package."*"]
opt-level = 2
